[project]
name = "clipfactory"
version = "0.1.0"
description = "Content factory: turns YouTube videos into viral short clips and auto-posts them to social networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
    "yt-dlp>=2024.8.6",
    "youtube-transcript-api>=0.6.2",
    "apscheduler>=3.10",
    "cryptography>=42.0",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
clipfactory = "clipfactory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipfactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is advisory; B008: FastAPI Depends() in defaults is idiomatic;
# UP042: keeping (str, Enum) for SQLAlchemy Enum(values_callable) compatibility.
ignore = ["E501", "B008", "UP042"]
