<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ClipFactory{% endblock %}</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --bg-card: #171a21;
    --bg-card-hover: #1d2129;
    --border: #262b35;
    --text: #e6e8eb;
    --text-dim: #9aa2af;
    --accent: #6ea8fe;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  nav {
    display: flex;
    gap: 4px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    flex-wrap: wrap;
    align-items: center;
  }
  nav .brand {
    font-weight: 700;
    margin-right: 24px;
    color: var(--accent);
  }
  nav a {
    color: var(--text-dim);
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  nav a:hover { background: var(--bg-card-hover); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  h2 { font-size: 16px; color: var(--text-dim); margin: 32px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card .value { font-size: 28px; font-weight: 700; }
  .card .label { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok, .badge.published, .badge.rendered, .badge.approved { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge.pending, .badge.queued, .badge.uploading, .badge.rendering { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .badge.failed, .badge.rejected, .badge.off { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge.platform { background: rgba(110,168,254,0.15); color: var(--accent); }
  form.inline-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 24px; }
  form.inline-form label { display: flex; flex-direction: column; font-size: 12px; color: var(--text-dim); gap: 4px; }
  input, select, textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { min-height: 70px; font-family: ui-monospace, monospace; }
  button {
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--red); color: #24070a; }
  button.small { padding: 5px 10px; font-size: 12px; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; flex-direction: row; }
  .muted { color: var(--text-dim); font-size: 13px; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .candidate-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .candidate-card h3 { margin: 0 0 6px; font-size: 15px; }
  .candidate-card .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .candidate-card video { width: 100%; border-radius: 8px; margin: 8px 0; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  a.link { color: var(--accent); }
  .empty { color: var(--text-dim); font-style: italic; padding: 16px; }
</style>
</head>
<body>
<nav>
  <span class="brand">ClipFactory</span>
  <a href="/">Огляд</a>
  <a href="/channels">Канали</a>
  <a href="/accounts">Акаунти</a>
  <a href="/routes">Маршрути</a>
  <a href="/moderation">Модерація</a>
  <a href="/posts">Публікації</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
